name: Release WhiteRTC Apps & CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-linux:
    name: Build Android, Linux Desktop & CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Android Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > whitertc-release.jks
            printf "storeFile=whitertc-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-whitertc}" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" > keystore.properties
            echo "Android signing credentials configured."
          else
            echo "No KEYSTORE_BASE64 provided, skipping release signing."
          fi

      - name: Build Android App, Linux Desktop & CLI Fat JAR
        run: |
          chmod +x gradlew build_daemon_native.sh
          if [ -f "keystore.properties" ]; then
            echo "==> Building signed Release APK, Linux DEB, and CLI Fat JAR..."
            ./gradlew :app:androidApp:assembleRelease :desktopApp:packageDeb :daemon:fatJar --no-daemon
          else
            echo "==> Building Debug APK, Linux DEB, and CLI Fat JAR..."
            ./gradlew :app:androidApp:assembleDebug :desktopApp:packageDeb :daemon:fatJar --no-daemon
          fi

      - name: Build Native Linux Daemon & CLI
        run: |
          ./build_daemon_native.sh

      - name: Collect Linux & Android Artifacts
        run: |
          mkdir -p dist-linux
          
          # Android APK
          if [ -f app/androidApp/build/outputs/apk/release/androidApp-release.apk ]; then
            cp app/androidApp/build/outputs/apk/release/androidApp-release.apk dist-linux/WhiteRTC-Android.apk
          elif [ -f app/androidApp/build/outputs/apk/debug/androidApp-debug.apk ]; then
            cp app/androidApp/build/outputs/apk/debug/androidApp-debug.apk dist-linux/WhiteRTC-Android.apk
          fi

          # Linux Deb Package
          find desktopApp/build/compose/binaries/main/deb -name "*.deb" -exec cp {} dist-linux/WhiteRTC-Linux.deb \; 2>/dev/null || true

          # CLI / Daemon Fat JAR (Runs on any OS with Java 21+)
          if [ -f daemon/build/libs/daemon-1.0.0-all.jar ]; then
            cp daemon/build/libs/daemon-1.0.0-all.jar dist-linux/whitertc-cli.jar
          elif [ -f daemon/build/libs/*-all.jar ]; then
            cp daemon/build/libs/*-all.jar dist-linux/whitertc-cli.jar
          fi

          # Native Linux Daemon Binary
          if [ -f daemon/build/native/nativeCompile/whitertc-daemon ]; then
            cp daemon/build/native/nativeCompile/whitertc-daemon dist-linux/whitertc-daemon
            chmod +x dist-linux/whitertc-daemon
          fi

          ls -la dist-linux/

      - name: Upload Linux & Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-android
          path: dist-linux/*
          retention-days: 1

  build-windows:
    name: Build Windows Desktop (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Windows Desktop (.exe & .msi)
        shell: bash
        run: |
          ./gradlew :desktopApp:packageMsi :desktopApp:packageExe --no-daemon

      - name: Collect Windows Artifacts
        shell: bash
        run: |
          mkdir -p dist-win
          find desktopApp/build/compose/binaries/main/exe -name "*.exe" -exec cp {} dist-win/WhiteRTC-Windows.exe \; 2>/dev/null || true
          find desktopApp/build/compose/binaries/main/msi -name "*.msi" -exec cp {} dist-win/WhiteRTC-Windows.msi \; 2>/dev/null || true
          ls -la dist-win/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: dist-win/*
          retention-days: 1

  publish-release:
    name: Publish Release to GitHub
    needs: [build-android-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'artifacts-*'
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > sha256sums.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "WhiteRTC Apps & CLI Release ${{ github.event.inputs.tag_name || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
